<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="100%" height="100%" style="background:#080C14; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="1">PATHSHALA LMS — END-TO-END SYSTEM ARCHITECTURE &amp; DATA FLOW</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748B" font-size="11">Bidirectional Data Pipelines: User Interaction -> Next.js 15 -> Gateway -> Strapi v5 RBAC -> PostgreSQL</text>

  <!-- TOP LAYER: CLIENT RUNTIME & USER ACTIONS -->
  <g filter="url(#shadow)">
    <rect x="40" y="75" width="1120" height="215" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <rect x="40" y="75" width="1120" height="28" rx="8" fill="url(#headerGrad)" />
    <text x="55" y="94" fill="#38BDF8" font-size="12" font-weight="700">1. PRESENTATION &amp; CLIENT STATE LAYER (Next.js 15 App Router on Vercel)</text>

    <!-- User Action Columns -->
    <!-- Column 1: Auth -->
    <rect x="55" y="112" width="260" height="162" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="68" y="132" fill="#F2662A" font-size="11" font-weight="700">[A] Authentication Flow</text>
    <text x="68" y="150" fill="#94A3B8" font-size="10">User submits /login</text>
    <text x="68" y="166" fill="#94A3B8" font-size="10">or 1-Click Demo Switcher</text>
    <path d="M 68 174 L 300 174" stroke="#1E293B" stroke-width="1" />
    <text x="68" y="190" fill="#E2E8F0" font-size="10">AuthContext State Mutation:</text>
    <text x="78" y="206" fill="#64748B" font-size="9.5">• Stores JWT in localStorage</text>
    <text x="78" y="222" fill="#64748B" font-size="9.5">• Injects Bearer token in headers</text>
    <text x="78" y="238" fill="#64748B" font-size="9.5">• Unlocks Role-Gated Nav/Routes</text>
    <text x="78" y="254" fill="#22C55E" font-size="9.5">State: user { id, role_type }</text>

    <!-- Column 2: Progress & Sequential -->
    <rect x="330" y="112" width="265" height="162" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="343" y="132" fill="#38BDF8" font-size="11" font-weight="700">[B] Sequential Progress Flow</text>
    <text x="343" y="150" fill="#94A3B8" font-size="10">Student clicks 'Mark Completed'</text>
    <text x="343" y="166" fill="#94A3B8" font-size="10">on /courses/[id]/lessons/[id]</text>
    <path d="M 343 174 L 580 174" stroke="#1E293B" stroke-width="1" />
    <text x="343" y="190" fill="#E2E8F0" font-size="10">UI Reactive Update:</text>
    <text x="353" y="206" fill="#64748B" font-size="9.5">• Optimistic lesson checkmark</text>
    <text x="353" y="222" fill="#64748B" font-size="9.5">• Dynamic progress % recalculation</text>
    <text x="353" y="238" fill="#64748B" font-size="9.5">• Automatically unlocks next lesson</text>
    <text x="353" y="254" fill="#38BDF8" font-size="9.5">Payload: { lessonId }</text>

    <!-- Column 3: Quiz Subsystem -->
    <rect x="610" y="112" width="260" height="162" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="623" y="132" fill="#A855F7" font-size="11" font-weight="700">[C] MCQ Quiz Engine Flow</text>
    <text x="623" y="150" fill="#94A3B8" font-size="10">Student takes quiz questions</text>
    <text x="623" y="166" fill="#94A3B8" font-size="10">Zero answer key on client fetch</text>
    <path d="M 623 174 L 855 174" stroke="#1E293B" stroke-width="1" />
    <text x="623" y="190" fill="#E2E8F0" font-size="10">Client Evaluation UI:</text>
    <text x="633" y="206" fill="#64748B" font-size="9.5">• Submits selected options map</text>
    <text x="633" y="222" fill="#64748B" font-size="9.5">• Renders celebration &amp; badge</text>
    <text x="633" y="238" fill="#64748B" font-size="9.5">• Author sees preview-only mode</text>
    <text x="633" y="254" fill="#A855F7" font-size="9.5">Payload: { answers: { q1: 1 } }</text>

    <!-- Column 4: Blog & Admin -->
    <rect x="885" y="112" width="260" height="162" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="898" y="132" fill="#EAB308" font-size="11" font-weight="700">[D] Blog &amp; Admin Studio</text>
    <text x="898" y="150" fill="#94A3B8" font-size="10">TipTap RichText Serialization</text>
    <text x="898" y="166" fill="#94A3B8" font-size="10">Admin instant role switcher</text>
    <path d="M 898 174 L 1130 174" stroke="#1E293B" stroke-width="1" />
    <text x="898" y="190" fill="#E2E8F0" font-size="10">Admin / Author Actions:</text>
    <text x="908" y="206" fill="#64748B" font-size="9.5">• TipTap HTML output -> POST /blog</text>
    <text x="908" y="222" fill="#64748B" font-size="9.5">• 1-Click Publish/Draft toggle</text>
    <text x="908" y="238" fill="#64748B" font-size="9.5">• Real-time user role promotion</text>
    <text x="908" y="254" fill="#EAB308" font-size="9.5">Payload: { role_type } | { html }</text>
  </g>

  <!-- TRANSPORT PIPELINES (DATA FLOW ARROWS) -->
  <g>
    <!-- Arrow A -->
    <path d="M 185 290 L 185 365 L 560 365 L 560 395" stroke="#F2662A" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <!-- Arrow B -->
    <path d="M 460 290 L 460 350 L 580 350 L 580 395" stroke="#38BDF8" stroke-width="2" fill="none" />
    <!-- Arrow C -->
    <path d="M 740 290 L 740 350 L 620 350 L 620 395" stroke="#A855F7" stroke-width="2" fill="none" />
    <!-- Arrow D -->
    <path d="M 1015 290 L 1015 365 L 640 365 L 640 395" stroke="#EAB308" stroke-width="2" stroke-dasharray="3,3" fill="none" />

    <rect x="420" y="335" width="360" height="24" rx="4" fill="#080C14" stroke="#475569" stroke-width="1" />
    <text x="600" y="351" text-anchor="middle" fill="#F1F5F9" font-size="10.5" font-weight="700">HTTPS API Ingress with Authorization: Bearer JWT</text>
  </g>

  <!-- GATEWAY LAYER -->
  <g filter="url(#shadow)">
    <rect x="200" y="395" width="800" height="50" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
    <text x="600" y="416" text-anchor="middle" fill="#A5B4FC" font-size="11.5" font-weight="700">2. EDGE GATEWAY &amp; REVERSE PROXY (Railway Hikari)</text>
    <text x="600" y="434" text-anchor="middle" fill="#E0E7FF" font-size="10">SSL/TLS 1.3 Termination • Dynamic CORS Reflection (Origin Header) • proxy: true -> Port 1337</text>
  </g>

  <!-- Transport down to Controllers -->
  <path d="M 600 445 L 600 480" stroke="#6366F1" stroke-width="2.5" fill="none" />
  <polygon points="600,486 596,478 604,478" fill="#6366F1" />

  <!-- MIDDLEWARE & CONTROLLERS LAYER -->
  <g filter="url(#shadow)">
    <rect x="40" y="490" width="1120" height="340" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <rect x="40" y="490" width="1120" height="28" rx="8" fill="url(#headerGrad)" />
    <text x="55" y="509" fill="#C084FC" font-size="12" font-weight="700">3. APPLICATION &amp; RBAC CONTROLLERS LAYER (Strapi v5 Core on Railway)</text>

    <!-- Middleware Chain -->
    <rect x="55" y="526" width="1090" height="28" rx="4" fill="#080C14" stroke="#27272A" stroke-width="1" />
    <text x="70" y="544" fill="#E4E4E7" font-size="10"><tspan fill="#C084FC" font-weight="700">Middleware Pipeline:</tspan> logger -> errors -> security (CSP) -> cors -> body -> <tspan fill="#F2662A" font-weight="700">Users-Permissions JWT Guard (ctx.state.user)</tspan></text>

    <!-- Pipeline 1: Auth Controller -->
    <rect x="55" y="565" width="260" height="250" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="68" y="585" fill="#F2662A" font-size="11" font-weight="700">POST /api/auth/local</text>
    <text x="68" y="602" fill="#E2E8F0" font-size="10">1. Query User by Identifier (email)</text>
    <text x="68" y="618" fill="#94A3B8" font-size="9.5">• Verify bcrypt password hash</text>
    <text x="68" y="634" fill="#94A3B8" font-size="9.5">• Check confirmed &amp; blocked flags</text>
    <text x="68" y="652" fill="#E2E8F0" font-size="10">2. Role &amp; Claims Resolution:</text>
    <text x="68" y="668" fill="#94A3B8" font-size="9.5">• Fetch role_type (admin/cm/inst/stud)</text>
    <text x="68" y="684" fill="#94A3B8" font-size="9.5">• Sign HS256 JWT with JWT_SECRET</text>
    <text x="68" y="702" fill="#E2E8F0" font-size="10">3. Return Payload:</text>
    <text x="68" y="718" fill="#22C55E" font-size="9.5">{ jwt: "...", user: { role_type } }</text>
    <text x="68" y="744" fill="#64748B" font-size="9">Handles Registration (/api/auth/local/register)</text>
    <text x="68" y="758" fill="#64748B" font-size="9">Auto-assigns role_type: 'student'</text>

    <!-- Pipeline 2: Enrollment Controller -->
    <rect x="330" y="565" width="265" height="250" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="343" y="585" fill="#38BDF8" font-size="11" font-weight="700">PUT /api/enrollments/:id/progress</text>
    <text x="343" y="602" fill="#E2E8F0" font-size="10">1. Verify Enrollment Ownership:</text>
    <text x="343" y="618" fill="#94A3B8" font-size="9.5">• ctx.state.user.id === enrollment.user</text>
    <text x="343" y="634" fill="#94A3B8" font-size="9.5">• Rejects non-owners with 403 Forbidden</text>
    <text x="343" y="652" fill="#E2E8F0" font-size="10">2. Progress Compute Engine:</text>
    <text x="343" y="668" fill="#94A3B8" font-size="9.5">• Fetch total course lessons count</text>
    <text x="343" y="684" fill="#94A3B8" font-size="9.5">• Deduplicate completed_lessons array</text>
    <text x="343" y="700" fill="#94A3B8" font-size="9.5">• progress = (completed / total) * 100</text>
    <text x="343" y="718" fill="#E2E8F0" font-size="10">3. Persist &amp; Return Payload:</text>
    <text x="343" y="734" fill="#22C55E" font-size="9.5">{ progress: 67, completed: [1, 2] }</text>
    <text x="343" y="758" fill="#38BDF8" font-size="9">Sequential sort order: lesson.order ASC</text>

    <!-- Pipeline 3: Quiz Controller -->
    <rect x="610" y="565" width="260" height="250" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="623" y="585" fill="#A855F7" font-size="11" font-weight="700">POST /api/quizzes/:id/submit</text>
    <text x="623" y="602" fill="#E2E8F0" font-size="10">1. Student Role Check Guard:</text>
    <text x="623" y="618" fill="#94A3B8" font-size="9.5">• if (user.role !== 'student') -> 403</text>
    <text x="623" y="634" fill="#94A3B8" font-size="9.5">• (Prevents authors contaminating stats)</text>
    <text x="623" y="652" fill="#E2E8F0" font-size="10">2. Server Auto-Grading Logic:</text>
    <text x="623" y="668" fill="#94A3B8" font-size="9.5">• Fetch true questions from DB</text>
    <text x="623" y="684" fill="#94A3B8" font-size="9.5">• Compare student option with correct</text>
    <text x="623" y="700" fill="#94A3B8" font-size="9.5">• score = (correctCount / total) * 100</text>
    <text x="623" y="718" fill="#94A3B8" font-size="9.5">• passed = score >= passing_score</text>
    <text x="623" y="734" fill="#E2E8F0" font-size="10">3. Persist Attempt &amp; Return:</text>
    <text x="623" y="750" fill="#22C55E" font-size="9.5">{ score: 100, passed: true, total: 3 }</text>

    <!-- Pipeline 4: Blog & Admin Controller -->
    <rect x="885" y="565" width="260" height="250" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="898" y="585" fill="#EAB308" font-size="11" font-weight="700">api::blog-post &amp; admin</text>
    <text x="898" y="602" fill="#E2E8F0" font-size="10">1. Draft Isolation Pipeline:</text>
    <text x="898" y="618" fill="#94A3B8" font-size="9.5">• If not Admin/CM, force DB query:</text>
    <text x="898" y="634" fill="#F59E0B" font-size="9.5">  WHERE is_published = true</text>
    <text x="898" y="650" fill="#94A3B8" font-size="9.5">• Direct draft slug query -> 404</text>
    <text x="898" y="668" fill="#E2E8F0" font-size="10">2. Admin User Role Switcher:</text>
    <text x="898" y="684" fill="#94A3B8" font-size="9.5">• PUT /api/admin-dashboard/users/:id</text>
    <text x="898" y="700" fill="#94A3B8" font-size="9.5">• Self-demotion check: if (admin === id)</text>
    <text x="898" y="716" fill="#EF4444" font-size="9.5">  throws 400 'Cannot demote self'</text>
    <text x="898" y="734" fill="#E2E8F0" font-size="10">3. Platform Stats Aggregator:</text>
    <text x="898" y="750" fill="#22C55E" font-size="9.5">Returns count of users, courses, enrolls</text>
  </g>

  <!-- TRANSPORT PIPELINES TO DATABASE -->
  <path d="M 600 830 L 600 870" stroke="#0284C7" stroke-width="2.5" fill="none" />
  <polygon points="600,877 596,869 604,869" fill="#0284C7" />
  <rect x="420" y="842" width="360" height="22" rx="4" fill="#080C14" stroke="#0284C7" stroke-width="1" />
  <text x="600" y="857" text-anchor="middle" fill="#BAE6FD" font-size="10.5" font-weight="700">Connection Pool (pg client / Knex Query Builder)</text>

  <!-- PERSISTENCE LAYER & RELATIONAL SCHEMA -->
  <g filter="url(#shadow)">
    <rect x="40" y="885" width="1120" height="225" rx="8" fill="#0F172A" stroke="#0369A1" stroke-width="1.5" />
    <rect x="40" y="885" width="1120" height="28" rx="8" fill="#0369A1" />
    <text x="55" y="904" fill="#FFFFFF" font-size="12" font-weight="700">4. PERSISTENCE LAYER &amp; DATABASE SCHEMA (PostgreSQL on Railway / SQLite Local)</text>

    <!-- Table 1 -->
    <rect x="55" y="922" width="200" height="175" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="68" y="942" fill="#38BDF8" font-size="11" font-weight="700">up_users (Table)</text>
    <text x="68" y="958" fill="#94A3B8" font-size="9.5">id: PK (Serial)</text>
    <text x="68" y="974" fill="#94A3B8" font-size="9.5">username: varchar</text>
    <text x="68" y="990" fill="#94A3B8" font-size="9.5">email: varchar (Unique)</text>
    <text x="68" y="1006" fill="#94A3B8" font-size="9.5">password: varchar (Hash)</text>
    <text x="68" y="1022" fill="#F2662A" font-size="9.5">role_type: enum (4 roles)</text>
    <text x="68" y="1038" fill="#94A3B8" font-size="9.5">role_id: FK -> up_roles</text>
    <text x="68" y="1058" fill="#64748B" font-size="9">Relations: 1:N Courses,</text>
    <text x="68" y="1072" fill="#64748B" font-size="9">1:N Enrollments, 1:N Posts</text>

    <!-- Table 2 -->
    <rect x="270" y="922" width="215" height="175" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="283" y="942" fill="#38BDF8" font-size="11" font-weight="700">courses &amp; lessons</text>
    <text x="283" y="958" fill="#94A3B8" font-size="9.5">courses.id: PK</text>
    <text x="283" y="974" fill="#94A3B8" font-size="9.5">title, slug, description</text>
    <text x="283" y="990" fill="#94A3B8" font-size="9.5">category, cover_color</text>
    <text x="283" y="1006" fill="#94A3B8" font-size="9.5">instructor_id: FK -> up_users</text>
    <text x="283" y="1024" fill="#E2E8F0" font-size="9.5">lessons Table (1:N):</text>
    <text x="283" y="1040" fill="#94A3B8" font-size="9.5">id: PK | title: varchar</text>
    <text x="283" y="1056" fill="#38BDF8" font-size="9.5">order: integer (Sequential)</text>
    <text x="283" y="1072" fill="#94A3B8" font-size="9.5">video_url, course_id: FK</text>

    <!-- Table 3 -->
    <rect x="500" y="922" width="215" height="175" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="513" y="942" fill="#38BDF8" font-size="11" font-weight="700">enrollments</text>
    <text x="513" y="958" fill="#94A3B8" font-size="9.5">id: PK (Serial)</text>
    <text x="513" y="974" fill="#94A3B8" font-size="9.5">user_id: FK -> up_users</text>
    <text x="513" y="990" fill="#94A3B8" font-size="9.5">course_id: FK -> courses</text>
    <text x="513" y="1006" fill="#38BDF8" font-size="9.5">progress: integer (0-100)</text>
    <text x="513" y="1022" fill="#94A3B8" font-size="9.5">completed_lessons: JSON</text>
    <text x="513" y="1038" fill="#94A3B8" font-size="9.5">enrolled_at: timestamp</text>
    <text x="513" y="1058" fill="#64748B" font-size="9">Constraint: Unique composite</text>
    <text x="513" y="1072" fill="#64748B" font-size="9">(user_id, course_id)</text>

    <!-- Table 4 -->
    <rect x="730" y="922" width="215" height="175" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="743" y="942" fill="#38BDF8" font-size="11" font-weight="700">quizzes &amp; attempts</text>
    <text x="743" y="958" fill="#94A3B8" font-size="9.5">quizzes.id: PK</text>
    <text x="743" y="974" fill="#94A3B8" font-size="9.5">title, description</text>
    <text x="743" y="990" fill="#94A3B8" font-size="9.5">passing_score: integer</text>
    <text x="743" y="1006" fill="#94A3B8" font-size="9.5">questions: JSON (Options + Key)</text>
    <text x="743" y="1024" fill="#E2E8F0" font-size="9.5">quiz_attempts Table:</text>
    <text x="743" y="1040" fill="#94A3B8" font-size="9.5">id: PK | user_id: FK</text>
    <text x="743" y="1056" fill="#A855F7" font-size="9.5">score: int | passed: bool</text>
    <text x="743" y="1072" fill="#94A3B8" font-size="9.5">submitted_answers: JSON</text>

    <!-- Table 5 -->
    <rect x="960" y="922" width="185" height="175" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    <text x="973" y="942" fill="#38BDF8" font-size="11" font-weight="700">blog_posts (Table)</text>
    <text x="973" y="958" fill="#94A3B8" font-size="9.5">id: PK (Serial)</text>
    <text x="973" y="974" fill="#94A3B8" font-size="9.5">title, slug (Unique)</text>
    <text x="973" y="990" fill="#94A3B8" font-size="9.5">excerpt: text</text>
    <text x="973" y="1006" fill="#94A3B8" font-size="9.5">content: text (richtext)</text>
    <text x="973" y="1022" fill="#EAB308" font-size="9.5">is_published: boolean</text>
    <text x="973" y="1038" fill="#94A3B8" font-size="9.5">published_date: datetime</text>
    <text x="973" y="1054" fill="#94A3B8" font-size="9.5">cover_image_url: varchar</text>
    <text x="973" y="1072" fill="#64748B" font-size="9">author_id: FK -> up_users</text>
  </g>
</svg>
