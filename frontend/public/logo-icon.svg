<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="psBrandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="60%" stop-color="#F2662A" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>

    <!-- Pearl Page Gradient -->
    <linearGradient id="pageGradLeft" x1="8" y1="12" x2="20" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0E6" />
    </linearGradient>

    <!-- Right Page Gradient -->
    <linearGradient id="pageGradRight" x1="20" y1="12" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4D6" />
    </linearGradient>

    <!-- Golden Crown Spark Gradient -->
    <linearGradient id="goldCapGrad" x1="12" y1="6" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="psEmblemShadow" x="0" y="2" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#F2662A" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="40" height="40" rx="10" fill="url(#psBrandGrad)" filter="url(#psEmblemShadow)"/>
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#FFFFFF" stroke-opacity="0.25" fill="none"/>

  <!-- Creative Motif: Open Knowledge Book + Graduation Mortarboard + Enlightenment Star -->
  <g transform="translate(0, 1)">
    <!-- Open Book - Left Wing / Page of Knowledge -->
    <path
      d="M20 31 C16.5 28.5 12.5 27 7.5 27.5 C6.7 27.6 6 26.9 6 26.1 V14.5 C6 13.7 6.7 13 7.5 13.1 C12 13.6 16.5 15.5 20 18.5 Z"
      fill="url(#pageGradLeft)"
    />
    <!-- Left Page Inner Accent Line -->
    <path
      d="M9.5 16 C13 16.5 16.5 18 19 20"
      stroke="#F2662A"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-opacity="0.35"
    />

    <!-- Open Book - Right Wing / Page of Skill Growth -->
    <path
      d="M20 31 C23.5 28.5 27.5 27 32.5 27.5 C33.3 27.6 34 26.9 34 26.1 V14.5 C34 13.7 33.3 13 32.5 13.1 C28 13.6 23.5 15.5 20 18.5 Z"
      fill="url(#pageGradRight)"
    />
    <!-- Right Page Inner Accent Line -->
    <path
      d="M30.5 16 C27 16.5 23.5 18 21 20"
      stroke="#C2410C"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-opacity="0.3"
    />

    <!-- Center Binding Spine Beam -->
    <path
      d="M19.25 32 C19.75 31.7 20.25 31.7 20.75 32 V19 C20.25 18.7 19.75 18.7 19.25 19 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />

    <!-- Graduation Mortarboard / Ascending Mastery Diamond -->
    <path
      d="M20 7.5 L28 11.5 L20 15.5 L12 11.5 Z"
      fill="url(#goldCapGrad)"
    />
    
    <!-- Mortarboard Shadow/Depth Band -->
    <path
      d="M14.5 13 L20 15.5 L25.5 13 L24 14.5 C21.5 16 18.5 16 16 14.5 Z"
      fill="#B45309"
      opacity="0.6"
    />

    <!-- Golden 4-Point Learning Star (Zenith of Enlightenment) -->
    <path
      d="M20 3.8 L21 6.5 L23.5 7.2 L21 7.9 L20 10.5 L19 7.9 L16.5 7.2 L19 6.5 Z"
      fill="#FFFFFF"
    />
    <circle cx="20" cy="7.2" r="0.8" fill="#FFE55C" />
  </g>
</svg>