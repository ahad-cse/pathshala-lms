<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" fill="none">
  <defs>
    <linearGradient id="psBrandGradFull" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="60%" stop-color="#F2662A" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
    <linearGradient id="pageGradLeftFull" x1="12" y1="16" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0E6" />
    </linearGradient>
    <linearGradient id="pageGradRightFull" x1="24" y1="16" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4D6" />
    </linearGradient>
    <linearGradient id="goldCapGradFull" x1="16" y1="10" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="psEmblemShadowFull" x="2" y="4" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#F2662A" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#psBrandGradFull)" filter="url(#psEmblemShadowFull)"/>
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#FFFFFF" stroke-opacity="0.25" fill="none"/>
    
    <g transform="translate(0, 1)">
      <!-- Open Book - Left Wing -->
      <path
        d="M20 31 C16.5 28.5 12.5 27 7.5 27.5 C6.7 27.6 6 26.9 6 26.1 V14.5 C6 13.7 6.7 13 7.5 13.1 C12 13.6 16.5 15.5 20 18.5 Z"
        fill="url(#pageGradLeftFull)"
      />
      <path d="M9.5 16 C13 16.5 16.5 18 19 20" stroke="#F2662A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.35"/>

      <!-- Open Book - Right Wing -->
      <path
        d="M20 31 C23.5 28.5 27.5 27 32.5 27.5 C33.3 27.6 34 26.9 34 26.1 V14.5 C34 13.7 33.3 13 32.5 13.1 C28 13.6 23.5 15.5 20 18.5 Z"
        fill="url(#pageGradRightFull)"
      />
      <path d="M30.5 16 C27 16.5 23.5 18 21 20" stroke="#C2410C" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.3"/>

      <!-- Center Binding Spine Beam -->
      <path d="M19.25 32 C19.75 31.7 20.25 31.7 20.75 32 V19 C20.25 18.7 19.75 18.7 19.25 19 Z" fill="#FFFFFF" opacity="0.95"/>

      <!-- Graduation Mortarboard / Ascending Mastery Diamond -->
      <path d="M20 7.5 L28 11.5 L20 15.5 L12 11.5 Z" fill="url(#goldCapGradFull)"/>
      <path d="M14.5 13 L20 15.5 L25.5 13 L24 14.5 C21.5 16 18.5 16 16 14.5 Z" fill="#B45309" opacity="0.6"/>

      <!-- Golden 4-Point Learning Star -->
      <path d="M20 3.8 L21 6.5 L23.5 7.2 L21 7.9 L20 10.5 L19 7.9 L16.5 7.2 L19 6.5 Z" fill="#FFFFFF"/>
      <circle cx="20" cy="7.2" r="0.8" fill="#FFE55C"/>
    </g>
  </g>

  <!-- PathShala Wordmark -->
  <text x="56" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">PathShala</text>
  
  <!-- LMS Badge Capsule (Refined & Compact) -->
  <rect x="154" y="16" width="30" height="15" rx="7.5" fill="#FFF2EB" stroke="#F2662A" stroke-width="1" stroke-opacity="0.3"/>
  <text x="169" y="26.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#F2662A" text-anchor="middle" letter-spacing="0.05em">LMS</text>
</svg>